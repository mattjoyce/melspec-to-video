# ==============================================================================
# AMBISONIC AUDIO NOTES
# ==============================================================================
# The pipeline automatically detects and handles Zoom H3-VR ambisonic recordings:
#
# - A-Format (raw capsule signals): Automatically converted to B-Format,
#   then W channel extracted for mono visualization
#
# - B-Format/AmbiX (W, Y, Z, X): W channel (omnidirectional) automatically
#   extracted for mono visualization
#
# - Regular mono/stereo files: Processed normally with librosa's default
#   mono conversion
#
# No manual conversion needed - detection happens automatically based on
# WAV metadata (Rec Mode, channel count, channel labels).
#
# The video output can include the original ambisonic audio (--include_audio),
# while the spectrogram visualization uses only the W channel.
# ==============================================================================
