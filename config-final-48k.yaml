audio_visualization:
  audio_visual_span: 1
  cmap: magma
  max_spectrogram_width: 6000
  interpolation: bilinear
  seconds_in_view: 45
  profiling_chunk_duration: 60 
mel_spectrogram:
  db_high: 0
  db_low: -70
  f_high: 10000
  f_low: 50
  hop_length: 400
  n_fft: 2048
  n_mels: 256
video:
  ffmpeg_binary: /opt/homebrew/bin/ffmpeg
  frame_rate: 30
  height: 200
  width: 1920
overlays:
  frequency_axis:
    enabled: True
    axis_position: 0.1
    axis_rgba: [255, 255, 255, 192]
    freq_hz: [100, 500, 1000, 2000, 5000, 10000]
  playhead:
    enabled: True
    playhead_position: 0.5
    playhead_width: 2
    playhead_rgba: [255, 255, 255, 192]
    playhead_section_rgba: [0, 0, 0, 0]
  labels:
    enabled: False
